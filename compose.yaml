services:
  docs:
    image: ghcr.io/itsektionen/docs:main
    pull_policy: always
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs.rule=Host(`docs.kth.it`)"
      - "traefik.http.routers.docs.entrypoints=https"
      - "traefik.http.routers.docs.tls=true"
      - "traefik.http.routers.docs.tls.certresolver=in"
      - "traefik.http.services.docs.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
