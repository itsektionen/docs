server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    port_in_redirect off;
    server_name_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Normally handled by next.config, but since we static export we do it here
    # /docs/*.md or /docs/*.mdx -> /llms.mdx/docs/*/content.md
    location ~* ^/docs/(.*)\.mdx?$ {
        try_files /llms.mdx/docs/$1/content.md =404;
    }

    # Accept: text/markdown header negotiation on docs paths
    location /docs/ {
        if ($http_accept ~* "text/markdown") {
            rewrite ^/docs/(.*)$ /llms.mdx/docs/$1/content.md last;
        }
        try_files $uri $uri.html $uri/ =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
